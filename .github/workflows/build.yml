# This workflow is configured for a Flutter project.
name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Menginstall Flutter SDK di server GitHub Actions
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Mengambil dependensi menggunakan Flutter, bukan Dart murni
      - name: Install dependencies
        run: flutter pub get

      # Menganalisis kode proyek Flutter Anda
      - name: Analyze project source
        run: flutter analyze

      # Menjalankan pengujian (jika ada). Jika belum ada test, step ini bisa dihapus atau di-comment
      - name: Run tests
        run: flutter test
